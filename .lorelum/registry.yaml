schema_version: 1
name: flower-moon-packs
packs:
  - name: windows-agent-ops
    description: Hard-won execution practices for AI coding agents driving Windows + Git Bash toolchains - environment visibility, command mangling, process control, scheduler semantics, and research methodology.
    releases:
      - version: 0.3.0
        ref: main
        path: packs/windows-agent-ops
  - name: research-ops
    description: Practices for experiment-driven research engineering - pre-registration, attribution discipline, artifact freezing, statistical test design, simulation and benchmark verification.
    releases:
      - version: 0.1.1
        ref: main
        path: packs/research-ops
  - name: app-delivery-ops
    description: Practices for shipping interactive applications - deterministic capture, offline-first sync, failure-oriented release gates, permission modeling, prompt engineering as code.
    releases:
      - version: 0.1.1
        ref: main
        path: packs/app-delivery-ops
  - name: toolchain-deploy-ops
    description: Practices for deployment, pipelines, and cross-platform toolchains - deploy verification, cache busting, parser fallbacks, rendering acceptance, WSL boundaries, headless engines.
    releases:
      - version: 0.1.1
        ref: main
        path: packs/toolchain-deploy-ops
  - name: narrative-writing
    description: Practices for agents writing or reviewing long-form narrative fiction - convergence discipline, surface-first drafting, character-first beats, deliverable fidelity.
    releases:
      - version: 0.1.0
        ref: main
        path: packs/narrative-writing
